<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Formulaire campagne Ads</title>
<link rel="icon" type="image/png" href="/src/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<script src="https://cdn.jsdelivr.net/npm/theme-change@2.5.0/index.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f1ea;--card:#ffffff;--ink:#1f2933;--muted:#5f6b76;--line:#e3ddd0;
  --pri:#0f766e;--on-pri:#ffffff;--soft:#e1f3f0;--gold:#b7791f;
  --warn-bg:#fff4d6;--warn-ink:#7a4b06;--ok-bg:#dff5e6;--ok-ink:#14532d;
  --err:#b45309;--focus:color-mix(in srgb,var(--pri) 72%,white);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);
  --header-h:148px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121917;--card:#1a2321;--ink:#e6ecea;--muted:#9aa8a4;--line:#2c3937;
    --pri:#2dd4bf;--on-pri:#06201d;--soft:#173a36;--gold:#f0b44c;
    --warn-bg:#3b2f10;--warn-ink:#f6d58a;--ok-bg:#12341f;--ok-ink:#9be7b3;
    --err:#f0b44c;--shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121917;--card:#1a2321;--ink:#e6ecea;--muted:#9aa8a4;--line:#2c3937;
  --pri:#2dd4bf;--on-pri:#06201d;--soft:#173a36;--gold:#f0b44c;
  --warn-bg:#3b2f10;--warn-ink:#f6d58a;--ok-bg:#12341f;--ok-ink:#9be7b3;
  --err:#f0b44c;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:var(--header-h)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.65;padding-bottom:140px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px
}

.skip{position:absolute;inset-inline-start:12px;top:-48px;z-index:40;padding:8px 14px;border-radius:10px;background:var(--pri);color:var(--on-pri);font-weight:700;text-decoration:none}
.skip:focus{top:12px}

.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top .row{max-width:860px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:13px;background:var(--pri);color:var(--on-pri);font-size:22px;flex:none;box-shadow:0 5px 12px color-mix(in srgb,var(--pri) 22%,transparent)}
.brand b{display:block;font-size:1.06em;line-height:1.25;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.78em;font-weight:600;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,420px)}
.header-actions{display:flex;align-items:center;gap:8px;flex:none}
.lang-control{position:relative}
.langs,.theme-btn{min-height:42px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
.langs[aria-expanded="true"],.theme-btn:hover,.langs:hover,.theme-btn:focus-visible,.langs:focus-visible{border-color:var(--pri);background:var(--soft)}
.lang-menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);z-index:10;min-width:168px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.lang-menu button{width:100%;min-height:40px;justify-content:flex-start;border:0;background:transparent;border-radius:9px;padding:7px 10px;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);transition:background .15s ease}
.lang-menu button:hover{background:var(--soft)}
.lang-menu button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.theme-btn{padding-inline:13px}
.theme-btn i,.btn i,.langs i{font-size:17px;line-height:1}
.section-icon{font-size:19px;color:var(--pri);flex:none}

.progress{max-width:860px;margin:0 auto;padding:4px 20px 8px;display:flex;align-items:center;gap:12px;font-size:.82em;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),color-mix(in srgb,var(--pri) 70%,var(--gold)));transition:width .3s ease}
.pill{white-space:nowrap;font-weight:600}
.pill.db-on{color:var(--ok-ink)}
.pill.db-error{color:var(--warn-ink)}
.secnav{max-width:860px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.secnav a{flex:none;min-width:34px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);text-decoration:none;font-size:.82em;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:background .18s ease,border-color .18s ease,color .18s ease}
.secnav a:hover{border-color:var(--pri);color:var(--pri);background:var(--soft)}

main{max-width:860px;margin:0 auto;padding:22px 20px 28px}
.intro{background:var(--soft);border:1px solid color-mix(in srgb,var(--pri) 16%,var(--line));border-radius:16px;padding:16px 18px;margin:0 0 20px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.03)}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 82%,transparent);border-radius:18px;padding:22px 22px 24px;margin-bottom:18px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--header-h) + 8px);transition:box-shadow .2s ease}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card-head{padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.card h2{margin:0;font-size:1.18em;display:flex;align-items:center;gap:10px;line-height:1.3}
.num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--on-pri);font-size:.85em;flex:none}
.section-help{margin:8px 0 0;color:var(--muted);font-size:.9em;line-height:1.5}

.q{margin-top:22px;padding-top:2px}
.q.sub{margin-top:14px;padding:12px 0 2px 0;padding-inline-start:14px;border-inline-start:3px solid color-mix(in srgb,var(--pri) 28%,var(--line));background:color-mix(in srgb,var(--soft) 35%,transparent);border-radius:0 12px 12px 0}
[dir="rtl"] .q.sub{border-radius:12px 0 0 12px}
.qlabel{display:block;font-weight:700;margin-bottom:4px;line-height:1.45}
.qhint{color:var(--muted);font-size:.86em;margin:0 0 10px;line-height:1.5}
.qhint:empty{display:none}
.qinfo{margin-top:10px}
.q.is-invalid .qlabel{color:var(--err)}
.qtools{display:flex;justify-content:flex-end;margin-top:8px}
.clear{border:0;background:transparent;color:var(--muted);font-size:.78em;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;border-radius:6px;transition:color .15s ease,background .15s ease}
.clear:hover,.clear:focus-visible{color:var(--pri);background:var(--soft)}

.inp{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
textarea.inp{min-height:104px;resize:vertical;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir="rtl"] select.inp{background-position:16px 50%,11px 50%;padding-inline-end:14px;padding-inline-start:32px}
.inp:hover{border-color:color-mix(in srgb,var(--pri) 42%,var(--line))}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.inp.is-invalid,.q.is-invalid .inp{border-color:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-bg) 80%,transparent)}
.other{margin-top:10px}
.unitrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unitrow .inp{max-width:240px;flex:1}
.unitrow span{color:var(--muted);font-weight:600}
.agerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.agerow .inp{width:auto;min-width:104px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;user-select:none;transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
.opt input{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.opt:focus-within{outline:3px solid var(--pri);outline-offset:2px}
.opt:hover{border-color:color-mix(in srgb,var(--pri) 48%,var(--line));background:color-mix(in srgb,var(--soft) 45%,var(--card))}
.opt.on{border-color:var(--pri);background:var(--soft);box-shadow:0 2px 8px color-mix(in srgb,var(--pri) 12%,transparent)}
.dot{width:22px;height:22px;margin-top:2px;flex:none;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:var(--on-pri)}
.dot.sq{border-radius:6px}
.opt.on .dot{background:var(--pri);border-color:var(--pri)}
.opt.on .dot:not(.sq){box-shadow:inset 0 0 0 4px var(--soft)}
.opt.on .dot.sq::after{content:"✓";font-weight:700}
.otxt{display:block;line-height:1.4;padding-top:1px}
.otxt small{display:block;color:var(--muted);font-size:.8em;line-height:1.4;margin-top:3px;font-weight:500}
.rec{font-style:normal;font-size:.72em;font-weight:700;margin-inline-start:6px;padding:2px 8px;border-radius:99px;background:var(--gold);color:#fff;vertical-align:middle}
:root[data-theme="dark"] .rec{color:var(--on-pri)}
.opt.single{display:inline-flex;align-items:center;max-width:100%}

.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:38px;padding:4px 14px;border-radius:999px;border:1px dashed var(--pri);background:transparent;color:var(--pri);font-weight:700;cursor:pointer;transition:background .18s ease,color .18s ease,border-color .18s ease}
.chip:hover,.chip:focus-visible{background:var(--soft);border-style:solid}

.note{padding:10px 14px;border-radius:12px;font-size:.92em;line-height:1.5;border:1px solid transparent}
.note.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn-ink) 18%,transparent)}
.note.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:color-mix(in srgb,var(--ok-ink) 16%,transparent)}

.dock{position:fixed;inset-inline:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.dock .row{max-width:860px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stat{flex:1 1 220px;font-size:.88em;color:var(--muted);line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.stat-dot{width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--muted);flex:none}
.stat.is-typing .stat-dot{background:var(--gold)}
.stat.is-saved .stat-dot,.stat.is-local .stat-dot,.stat.is-restored .stat-dot,.stat.is-ready .stat-dot{background:var(--pri)}
.stat.is-db_err .stat-dot{background:var(--err)}
.stat b{display:block;color:var(--ink);font-size:1.02em}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:46px;padding:8px 16px;border-radius:11px;border:2px solid var(--pri);background:var(--pri);color:var(--on-pri);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .18s ease,transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 4px 10px color-mix(in srgb,var(--pri) 22%,transparent)}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn:disabled{opacity:.6;cursor:wait;transform:none}

.modal{position:fixed;inset:0;z-index:20;background:rgba(18,25,23,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;width:100%;max-width:700px;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.sheet h3{margin:0;font-size:1.15em}
.sheet textarea{flex:1;min-height:44vh;width:100%;font:inherit;font-size:.92em;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.sheet textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.toast{position:fixed;inset-inline:16px;bottom:104px;z-index:30;max-width:520px;margin:0 auto;padding:13px 18px;border-radius:14px;background:var(--ok-bg);color:var(--ok-ink);font-weight:700;box-shadow:var(--shadow);text-align:center;border:1px solid color-mix(in srgb,var(--ok-ink) 16%,transparent)}
.toast.err{background:var(--warn-bg);color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn-ink) 18%,transparent)}

@media (max-width:860px){
  .brand small{max-width:42vw}
}
@media (max-width:720px){
  :root{--header-h:196px}
  .top .row{flex-wrap:wrap;padding-bottom:10px}
  .brand{flex:1;min-width:0}
  .header-actions{width:auto;margin-inline-start:auto}
  .secnav,.progress,.top .row,main,.dock .row{padding-inline:16px}
}
@media (max-width:620px){
  body{font-size:16px;padding-bottom:168px}
  :root{--header-h:220px}
  .top .row,main,.progress,.secnav,.dock .row{padding-inline:14px}
  .brand small{white-space:normal;max-width:none}
  .header-actions{width:100%;justify-content:flex-end}
  .langs span,.theme-btn span{display:none}
  .card{padding:16px 14px 20px}
  .card h2{font-size:1.05em}
  .opts{grid-template-columns:1fr}
  .unitrow .inp{max-width:none}
  .dock .row{align-items:stretch}
  .stat{flex-basis:100%}
  .btns,.btns .btn{width:100%}
  .btns .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .bar i,.opt,.inp,.btn,.chip,.card,.clear,.langs,.theme-btn{transition:none}
}
.print-root{display:none!important}
.print-doc{max-width:760px;margin:0 auto;color:#1f2933;background:#fff}
.print-banner{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid #0f766e;margin-bottom:18px}
.print-mark{width:48px;height:48px;border-radius:14px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.print-banner h1{margin:0 0 4px;font-size:1.35em;line-height:1.3}
.print-banner p{margin:0;color:#5f6b76;font-size:.88em}
.print-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin:0 0 22px;padding:12px 14px;border:1px solid #e3ddd0;border-radius:12px;background:#f7f4ee}
.print-meta div{min-width:0}
.print-meta span{display:block;color:#5f6b76;font-size:.75em;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.print-meta b{display:block;margin-top:2px;font-size:.95em}
.print-sec{break-inside:avoid;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid #eee}
.print-sec h2{margin:0 0 10px;font-size:1.05em;color:#0f766e;display:flex;align-items:center;gap:8px}
.print-sec h2 em{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#0f766e;color:#fff;font-size:.78em}
.print-row{display:grid;grid-template-columns:minmax(140px,.42fr) minmax(0,.58fr);gap:8px 16px;padding:7px 0;border-top:1px dotted #e7e1d6}
.print-row:first-of-type{border-top:0}
.print-q{font-weight:700;line-height:1.4}
.print-a{line-height:1.45;white-space:pre-wrap;word-break:break-word}
.print-a.empty{color:#8a939b;font-weight:500}
.print-foot{margin-top:22px;padding-top:10px;border-top:1px solid #e3ddd0;color:#5f6b76;font-size:.8em;display:flex;justify-content:space-between;gap:12px}

@page{size:A4;margin:14mm 12mm 16mm}
@media print{
  html,body{background:#fff!important;color:#111;padding:0!important;margin:0}
  body.printing > *:not(.print-root){display:none!important}
  .print-root{display:block!important;position:static;inset:auto;background:#fff}
  .print-doc{max-width:none;margin:0}
  .print-sec,.print-row,.print-banner,.print-meta{break-inside:avoid}
}
</style>
</head>
<body>

<a class="skip" href="#main" id="skipLink"></a>
<header class="top">
  <div class="row">
    <div class="brand"><span class="logo fi fi-rr-edit" aria-hidden="true"></span><div><b id="t-title"></b><small id="t-org"></small></div></div>
    <div class="header-actions">
      <div class="lang-control">
        <button type="button" class="langs" id="btnLang" aria-expanded="false" aria-haspopup="true" aria-controls="langMenu"><i class="fi fi-rr-language" aria-hidden="true"></i><span id="langLabel"></span></button>
        <div class="lang-menu" id="langMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-lang="ar" aria-pressed="false"><i class="fi fi-rr-globe" aria-hidden="true"></i><span>العربية</span></button>
          <button type="button" role="menuitem" data-lang="fr" aria-pressed="false"><i class="fi fi-rr-globe" aria-hidden="true"></i><span>Français</span></button>
        </div>
      </div>
      <button type="button" class="theme-btn" id="btnTheme" aria-pressed="false"><i class="fi fi-rr-moon" aria-hidden="true"></i><span id="themeLabel"></span></button>
    </div>
  </div>
  <div class="progress">
    <div class="bar" id="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    <span id="ptxt" class="pill"></span>
    <span id="dbstate" class="pill"></span>
  </div>
  <nav class="secnav" id="secnav"></nav>
</header>

<main id="main">
  <p class="intro" id="intro"></p>
  <div id="form"></div>
</main>

<footer class="dock">
  <div class="row">
    <div class="stat" id="statbox"><span class="stat-dot" aria-hidden="true"></span><div><b id="status" aria-live="polite"></b><span id="last"></span></div></div>
    <div class="btns">
      <button type="button" class="btn ghost" id="btnSummary"></button>
      <button type="button" class="btn ghost" id="btnPdf"></button>
    </div>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sumTitle" id="sheet">
    <h3 id="sumTitle"></h3>
    <textarea id="sumtxt" readonly></textarea>
    <div class="btns"><button type="button" class="btn" id="btnCopy"></button><button type="button" class="btn ghost" id="btnClose"></button></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="print-root" id="printRoot" hidden></div>

<script src="/src/app.js"></script>
</body>
</html>
